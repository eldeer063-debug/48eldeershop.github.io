<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>48ELDEER SHOP</title>
<style>
:root{--bg:#fff;--tx:#000;--mu:#666;--ln:#e3e3e3;--sf:#f6f6f6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fadeIn .7s ease both}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 20px}
.logo{font-weight:800;letter-spacing:1px;font-size:20px}
nav{display:flex;flex-wrap:wrap;gap:4px 16px;flex:1}
nav a{color:var(--tx);text-decoration:none;font-size:14px;padding:4px 0;border-bottom:2px solid transparent;cursor:pointer}
nav a.on,nav a:hover{border-color:#000}
.btn{background:#000;color:#fff;border:1px solid #000;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}
.btn.o{background:#fff;color:#000}.btn:hover{opacity:.8}.btn.s{padding:6px 12px;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:24px 18px 50px;min-height:70vh}
h1{font-size:28px;margin:0 0 4px}h2{font-size:20px;margin:28px 0 12px;border-bottom:1px solid var(--ln);padding-bottom:6px}
.mu{color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{border:1px solid var(--ln);border-radius:12px;padding:10px;background:#fff}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--sf);display:block}
.card b{display:block;margin-top:8px;font-size:14px}.card .p{margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #000;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;background:#fff;color:#000;font-family:inherit}
.chip.on{background:#000;color:#fff}.chip.dis{border-color:var(--ln);color:var(--mu);cursor:default}
.box{border:1px solid var(--ln);border-radius:12px;padding:16px;margin:12px 0;background:#fff}
label{display:block;font-size:13px;margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit;background:#fff;color:#000}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.tot{font-weight:700;border-top:1px solid #000;margin-top:6px;padding-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:30px 14px}
.ov.on{display:flex}.md{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:20px;animation:fadeIn .4s ease both}
.x{float:right;background:none;border:0;font-size:22px;cursor:pointer}
.code{font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;border:2px dashed #000;border-radius:10px;padding:14px;margin:12px 0}
.note{background:var(--sf);border-left:3px solid #000;padding:10px 12px;font-size:13px;margin:10px 0}
footer{border-top:1px solid var(--ln);padding:22px 18px;text-align:center;font-size:14px}
footer a{color:#000;margin:0 10px;font-weight:600}
.pay{display:none}.pay.on{display:block}
</style>
</head>
<body>
<header>
  <span class="logo">48ELDEER SHOP</span>
  <nav id="nav"></nav>
  <button class="btn o s" id="bAuth"></button>
  <button class="btn s" id="bCart"></button>
</header>
<main id="app"></main>
<footer>
  <div style="font-weight:800;margin-bottom:6px">48ELDEER</div>
  <a href="https://www.instagram.com/48eldeer_?xtok=MWd3MmZ0Zzl5czEyYQ==" target="_blank" rel="noopener">Instagram</a>
  <a href="https://www.tiktok.com/@48eldeer_?_r=1&_t=ZS-9Aw4PylQW2u" target="_blank" rel="noopener">TikTok</a>
  <a href="https://x.com/48eldeer_ofc" target="_blank" rel="noopener">X</a>
  <a href="https://wa.me/6283872320856" target="_blank" rel="noopener">Customer Service</a>
</footer>
<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script>
/* ====== DATA (ubah gambar di kolom img: isi dengan URL .jpg/.png milikmu) ====== */
const ph=t=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#f0f0f0"/><text x="150" y="205" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#555">'+t+'</text></svg>');
const PRODUK={
 "Photocard":[
  {id:"pc1",nama:"Photocard ASL",harga:40000,img:"pc1.jpg"},
  {id:"pc2",nama:"Photocard LDP",harga:30000,img:"pc2.jpg"},
  {id:"pc3",nama:"Photocard Pocky",harga:30000,img:"pc3.jpg"}],
 "Photopack":[
  {id:"pp1",nama:"Photopack LDP",harga:40000,img:"pp1.jpg"},
  {id:"pp2",nama:"Photopack RH",harga:45000,img:"pp4.jpg"},
  {id:"pp3",nama:"Photopack ASL",harga:50000,img:"pp3.jpg"}],
 "Merch":[
  {id:"mc1",nama:"Lightstick JKT48 FIGHT",harga:200000,img:"lighstick.jpg"},
  {id:"mc2",nama:"Tote Bag",harga:85000,img:"totebag.jpg"},
  {id:"mc3",nama:"T-Shirt",harga:120000,img:"tshirt.jpg"}]
};
const ALLP=Object.values(PRODUK).flat();
const EVENTS=[
 {k:"Bali",tgl:"31 Oktober 2026",tmp:"Beachwalk Shopping Center, Kuta, Bali",z:"WITA"},
 {k:"Manado",tgl:"14 November 2026",tmp:"Mega Mall Manado, Sulawesi Utara",z:"WITA"},
 {k:"Lombok",tgl:"21 November 2026",tmp:"Lombok Epicentrum Mall, Nusa Tenggara Barat",z:"WITA"},
 {k:"Sleman",tgl:"28 November 2026",tmp:"Sleman City Hall, DI Yogyakarta",z:"WIB"},
 {k:"Balikpapan",tgl:"5 Desember 2026",tmp:"Central Park Borneo Bay Mall, Kalimantan Timur",z:"WITA"}];
const SESI=["14.00-15.00","15.00-16.00","16.00-17.00","17.00-18.00"];
const HARGA={
 90000:["Abigail Rachel","Catherina Vallencia"],
 80000:["Adeline Wijaya","Angelina Christy","Marsha Lenathea","Oline Manuel","Hillary Abigail"],
 75000:["Fiony Alveria","Freya Jayawardana","Greesella Adhalia"],
 60000:["Anindya Ramadhani","Aurellia","Aurhel Alana","Celline Thefani","Cornelia Vanisa","Cynthia Yaputera","Dena Natalia","Desy Natalia","Febriola Sinambela","Feni Fitriyanti","Fritzy Rosmerian","Gabriela Abigail","Gita Sekar Andarini","Grace Octaviani","Helisma Putri","Indah Cahya","Jazzlyn Trisha","Jessica Chandra","Jesslyn Elly","Kathrina Irene","Lulu Salsabila","Michelle Alexandra","Michelle Levia","Mikaela Kusjanto","Mutiara Azzahra","Nayla Suji","Nina Tutachia","Raisha Syifa","Ribka Budiman","Shabilqis Naila","Victoria Kimberly"]};
const PERSONAL=["Abigail Rachel","Adeline Wijaya","Afera Thalia","Angelina Christy","Anindya Ramadhani","Astrella Virgiananda","Aurellia","Aurhel Alana","Bong Aprilli","Carissa Dini","Catherina Vallencia","Celline Thefani","Christabella Bonita","Cornelia Vanisa","Cynthia Yaputera","Dena Natalia","Desy Natalia","Fahira Putri","Fatimah Azzahra","Febriola Sinambela","Feni Fitriyanti","Fiony Alveria","Freya Jayawardana","Fritzy Rosmerian","Gabriela Abigail","Gita Sekar Andarini","Grace Octaviani","Greesella Adhalia","Hagia Sopia","Heidi Suyangga","Helisma Putri","Hillary Abigail","Humaira Ramadhani","Indah Cahya","Jacqueline Immanuela","Jazzlyn Trisha","Jemima Evodie","Jessica Chandra","Jesslyn Elly","Kathrina Irene","Lulu Salsabila","Marsha Lenathea","Maxine Faye","Michelle Alexandra","Michelle Levia","Mikaela Kusjanto","Mutiara Azzahra","Nayla Suji","Nina Tutachia","Nur Intan","Oline Manuel","Putry Jazyta","Raisha Syifa","Ralyne Van Irwan","Ribka Budiman","Shabilqis Naila","Sona Kalyana","Victoria Kimberly"];
const WA_CS="https://wa.me/6283872320856", WA_JASTIP="https://wa.me/6287773931086";

/* ====== STATE ====== */
let cart=[],user=null,users={},orders={},jok={tab:"mini",city:null,sesi:null,members:[]};
try{orders=JSON.parse(localStorage.getItem("48e_orders")||"{}")}catch(e){}
const $=s=>document.querySelector(s),rp=n=>"Rp"+n.toLocaleString("id-ID");
const kode=()=>"48E-"+Math.random().toString(36).slice(2,8).toUpperCase();
const saveOrder=(c,o)=>{orders[c]=o;try{localStorage.setItem("48e_orders",JSON.stringify(orders))}catch(e){}};
const priceOf=n=>+Object.keys(HARGA).find(p=>HARGA[p].includes(n));
const cartCount=()=>cart.reduce((a,b)=>a+b.qty,0);

/* ====== MODAL ====== */
function modal(h){$("#md").innerHTML='<button class="x" onclick="closeM()">×</button>'+h;$("#ov").classList.add("on")}
function closeM(){$("#ov").classList.remove("on")}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeM()});

/* ====== HEADER ====== */
const PAGES=[["home","Belanja"],["joki","Joki mng & 2 shoot"],["jastip","Jastip"],["cek","Cek Pesanan"],["kontak","Kontak"]];
function head(){
  const p=(location.hash||"#home").slice(1);
  $("#nav").innerHTML=PAGES.map(([k,t])=>`<a class="${p===k?"on":""}" href="#${k}">${t}</a>`).join("");
  $("#bAuth").textContent=user?"Hai, "+user.nama.split(" ")[0]+" (Keluar)":"Daftar / Login";
  $("#bCart").textContent="Keranjang ("+cartCount()+")";
}
$("#bAuth").onclick=()=>user?(user=null,head()):authM("login");
$("#bCart").onclick=cartM;

/* ====== AUTH ====== */
function authM(t){
  modal(`<h2 style="margin-top:0">${t==="login"?"Login":"Daftar Akun"}</h2>
  ${t==="daftar"?'<label>Nama</label><input id="aN">':""}
  <label>Email</label><input id="aE" type="email"><label>Password</label><input id="aP" type="password">
  <p><button class="btn" onclick="auth('${t}')">${t==="login"?"Login":"Daftar"}</button>
  <button class="btn o" onclick="authM('${t==="login"?"daftar":"login"}')">${t==="login"?"Belum punya akun? Daftar":"Sudah punya akun? Login"}</button></p><div id="aMsg" class="mu"></div>`);
}
function auth(t){
  const e=$("#aE").value.trim(),p=$("#aP").value,m=$("#aMsg");
  if(!e||!p){m.textContent="Lengkapi email dan password.";return}
  if(t==="daftar"){const n=$("#aN").value.trim();if(!n){m.textContent="Isi nama.";return}
    if(users[e]){m.textContent="Email sudah terdaftar.";return}
    users[e]={nama:n,p};user={nama:n,email:e};closeM();head()}
  else{const u=users[e];if(!u||u.p!==p){m.textContent="Email atau password salah (atau belum daftar).";return}
    user={nama:u.nama,email:e};closeM();head()}
}

/* ====== CART & CHECKOUT ====== */
function add(id){const c=cart.find(x=>x.id===id);c?c.qty++:cart.push({id,qty:1});head()}
function buyNow(id){cart=[{id,qty:1}];head();payM()}
function cartTotal(){return cart.reduce((a,c)=>a+ALLP.find(p=>p.id===c.id).harga*c.qty,0)}
function cartM(){
  if(!cart.length){modal('<h2 style="margin-top:0">Keranjang</h2><p class="mu">Keranjang masih kosong.</p>');return}
  modal(`<h2 style="margin-top:0">Keranjang</h2>`+cart.map(c=>{const p=ALLP.find(x=>x.id===c.id);
   return `<div class="row"><span>${p.nama}<br><span class="mu">${rp(p.harga)}</span></span><span>
   <button class="btn o s" onclick="qty('${c.id}',-1)">−</button> ${c.qty} <button class="btn o s" onclick="qty('${c.id}',1)">+</button></span></div>`}).join("")+
   `<div class="row tot"><span>Total</span><span>${rp(cartTotal())}</span></div><p><button class="btn" onclick="payM()">Checkout</button></p>`);
}
function qty(id,d){const c=cart.find(x=>x.id===id);c.qty+=d;if(c.qty<1)cart=cart.filter(x=>x!==c);head();cartM()}
function payM(){
  if(!cart.length)return;
  modal(`<h2 style="margin-top:0">Pembayaran</h2>
  <label>Nama</label><input id="pN" value="${user?user.nama:""}">
  <label>Alamat lengkap</label><textarea id="pA" rows="3"></textarea>
  <label>No. WhatsApp</label><input id="pW" type="tel">
  <label>Metode pembayaran</label>
  <select id="pM" onchange="$('#tf').classList.toggle('on',this.value==='Transfer')"><option>Cash</option><option>COD</option><option>Transfer</option></select>
  <div id="tf" class="pay"><label>Transfer via</label><select id="pT"><option>QRIS</option><option>GoPay</option><option>DANA</option><option>OVO</option><option>Bank</option></select></div>
  <div class="box"><b>Ringkasan</b>`+cart.map(c=>{const p=ALLP.find(x=>x.id===c.id);return `<div class="row"><span>${p.nama} ×${c.qty}</span><span>${rp(p.harga*c.qty)}</span></div>`}).join("")+
  `<div class="row tot"><span>Total</span><span>${rp(cartTotal())}</span></div></div>
  <div id="pE" class="mu"></div><button class="btn" onclick="kirimShop()">Enter &amp; Kirim</button>`);
}
function kirimShop(){
  const n=$("#pN").value.trim(),a=$("#pA").value.trim(),w=$("#pW").value.trim();
  if(!n||!a||!w){$("#pE").textContent="Nama, alamat, dan No. WA wajib diisi.";return}
  const m=$("#pM").value,c=kode();
  saveOrder(c,{tipe:"Belanja",nama:n,metode:m==="Transfer"?"Transfer "+$("#pT").value:m,total:cartTotal(),item:cart.map(x=>ALLP.find(p=>p.id===x.id).nama+" ×"+x.qty),status:"Menunggu konfirmasi"});
  cart=[];head();
  modal(`<h2 style="margin-top:0">Pesanan terkirim ✔</h2><p>Kode pemesanan kamu:</p><div class="code">${c}</div>
  <p class="mu">Simpan kode ini untuk Cek Pesanan. Untuk pembayaran/konfirmasi, hubungi customer service.</p>
  <a class="btn" href="${WA_CS}" target="_blank" rel="noopener">Hubungi CS</a>`);
}

/* ====== PAGES ====== */
function home(){
  return `<h1>Photocard, Photopack &amp; Merch</h1><p class="mu">Klik “Beli” untuk langsung bayar, atau tambah ke keranjang</p>`+
  Object.entries(PRODUK).map(([k,l])=>`<h2>${k}</h2><div class="grid">`+l.map(p=>`<div class="card fade"><img src="${p.img}" alt="${p.nama}">
  <b>${p.nama}</b><div class="p">${rp(p.harga)}</div>
  <button class="btn s" onclick="buyNow('${p.id}')">Beli</button> <button class="btn o s" onclick="add('${p.id}')">+ Keranjang</button></div>`).join("")+`</div>`).join("");
}
function joki(){
  const t=jok.tab;
  let h=`<h1>Joki MNG &amp; 2Shoot</h1><div class="chips fade" style="margin:12px 0">
   <button class="chip ${t==="mini"?"on":""}" onclick="jTab('mini')">Event: Mini Tour</button>
   <button class="chip ${t==="personal"?"on":""}" onclick="jTab('personal')">Personal MNG &amp; 2Shoot</button></div>`;
  if(t==="personal"){
    h+=`<div class="box fade"><b>Personal MNG &amp; 2Shoot</b><br>20 Desember 2026 — Convention Hall Tunjungan Plaza 3, Lantai 6, Surabaya<div class="note">Event ini belum tersedia untuk sesinya. Berikut daftar member.</div>
    <div class="chips">${PERSONAL.map(n=>`<span class="chip dis">${n}</span>`).join("")}</div></div>`;
    return h;
  }
  const ev=EVENTS.find(e=>e.k===jok.city);
  h+=`<h2>1. Pilih Tempat Event</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">`+
  EVENTS.map(e=>`<div class="card fade" style="${e.k===jok.city?"border-color:#000;border-width:2px":""}"><b>${e.k}</b><div class="mu">${e.tgl}<br>${e.tmp}</div><p><button class="btn s" onclick="jCity('${e.k}')">Pilih</button></p></div>`).join("")+`</div>`;
  if(ev){
    h+=`<h2>2. Pilih Sesi (${ev.k})</h2><div class="chips">`+SESI.map((s,i)=>`<button class="chip ${jok.sesi===i?"on":""}" onclick="jSesi(${i})">Sesi ${i+1} · ${s} ${ev.z}</button>`).join("")+`</div>
    <h2>3. Pilih Member (klik untuk lihat harga)</h2>`+
    Object.keys(HARGA).sort((a,b)=>b-a).map(p=>`<div class="box fade"><b>${rp(+p)}</b><div class="chips" style="margin-top:8px">`+
      HARGA[p].map(n=>`<button class="chip ${jok.members.includes(n)?"on":""}" onclick="jMem('${n.replace(/'/g,"\\'")}')">${n}</button>`).join("")+`</div></div>`).join("");
    const tot=jok.members.reduce((a,n)=>a+priceOf(n),0);
    h+=`<div class="box"><b>Pesanan joki</b>${jok.members.length?jok.members.map(n=>`<div class="row"><span>${n}</span><span>${rp(priceOf(n))}</span></div>`).join("")+`<div class="row tot"><span>Total</span><span>${rp(tot)}</span></div>`:'<p class="mu">Belum ada member dipilih.</p>'}
    <button class="btn" onclick="jPesan()">Klik Pesan</button></div>`;
  }
  return h;
}
const jTab=t=>{jok.tab=t;render()},jCity=c=>{jok.city=c;jok.sesi=null;jok.members=[];render()},jSesi=i=>{jok.sesi=i;render()};
function jMem(n){jok.members=jok.members.includes(n)?jok.members.filter(x=>x!==n):[...jok.members,n];render()}
function jPesan(){
  if(jok.sesi===null||!jok.members.length){alert("Pilih sesi dan minimal satu member dulu.");return}
  const ev=EVENTS.find(e=>e.k===jok.city),tot=jok.members.reduce((a,n)=>a+priceOf(n),0);
  modal(`<h2 style="margin-top:0">Pembayaran Joki</h2>
  <label>Nama</label><input id="jN" value="${user?user.nama:""}">
  <label>Pesanan sudah sesuai?</label><select id="jS"><option value="">— pilih —</option><option>Sudah sesuai</option><option>Belum sesuai</option></select>
  <label>JKT48 Point sudah diisi?</label><select id="jP"><option value="">— pilih —</option><option>Sudah diisi</option><option>Belum diisi</option></select>
  <div class="note">Untuk email JKT48 dan password, silakan hubungi customer service: <a href="${WA_CS}" target="_blank" rel="noopener">${WA_CS}</a></div>
  <div class="box"><b>Ringkasan</b><div class="row"><span>${ev.k} · ${ev.tgl}</span></div><div class="row"><span>Sesi ${jok.sesi+1} · ${SESI[jok.sesi]} ${ev.z}</span></div>`+
  jok.members.map(n=>`<div class="row"><span>${n}</span><span>${rp(priceOf(n))}</span></div>`).join("")+`<div class="row tot"><span>Total</span><span>${rp(tot)}</span></div></div>
  <div id="jE" class="mu"></div><button class="btn" onclick="kirimJoki(${tot})">Enter &amp; Kirim</button>`);
}
function kirimJoki(tot){
  const n=$("#jN").value.trim(),s=$("#jS").value,p=$("#jP").value;
  if(!n||!s||!p){$("#jE").textContent="Lengkapi nama dan semua pilihan konfirmasi.";return}
  const ev=EVENTS.find(e=>e.k===jok.city),c=kode();
  saveOrder(c,{tipe:"Joki Mini Tour",nama:n,metode:"-",total:tot,item:[ev.k+" · Sesi "+(jok.sesi+1)+" ("+SESI[jok.sesi]+" "+ev.z+")",...jok.members],status:"Menunggu konfirmasi CS · "+p});
  jok.members=[];jok.sesi=null;render();
  modal(`<h2 style="margin-top:0">Pesanan joki terkirim ✔</h2><p>Kode pemesanan kamu:</p><div class="code">${c}</div>
  <p class="mu">Silakan konfirmasi ke customer service dengan menyertakan kode ini.</p>
  <a class="btn" href="${WA_CS}" target="_blank" rel="noopener">Konfirmasi ke CS</a>`);
}
function jastip(){
  return `<h1>Jastip</h1><div class="box fade"><p>Pemesanan jastip dilakukan melalui WhatsApp / customer service jastip.</p>
  <a class="btn" href="${WA_JASTIP}" target="_blank" rel="noopener">Pesan Jastip via WhatsApp</a></div>`;
}
function cek(){
  return `<h1>Cek Pesanan</h1><div class="box fade"><label>Masukkan kode pemesanan</label><input id="cK" placeholder="48E-XXXXXX">
  <p><button class="btn" onclick="cekGo()">Cek</button></p><div id="cR"></div></div>
  <p class="mu">Status pesanan dapat dikonfirmasi juga lewat customer service.</p>`;
}
function cekGo(){
  const c=$("#cK").value.trim().toUpperCase(),o=orders[c];
  $("#cR").innerHTML=o?`<div class="note"><b>${c}</b> · ${o.tipe}<br>Atas nama: ${o.nama}<br>Pembayaran: ${o.metode}<br>${o.item.join("<br>")}<br><b>Total: ${rp(o.total)}</b><br>Status: ${o.status}</div>`:
  `<div class="note">Kode tidak ditemukan di perangkat ini. Hubungi <a href="${WA_CS}" target="_blank" rel="noopener">customer service</a>.</div>`;
}
function kontak(){
  return `<h1>Kontak</h1><div class="box fade"><p>Butuh bantuan? Tim customer service 48ELDEER siap membantu.</p>
  <a class="btn" href="${WA_CS}" target="_blank" rel="noopener">WhatsApp Customer Service</a></div>`;
}

/* ====== ROUTER ====== */
function render(){
  const p=(location.hash||"#home").slice(1),f={home,joki,jastip,cek,kontak}[p]||home;
  const y=scrollY;$("#app").innerHTML=f();head();scrollTo(0,y);
}
addEventListener("hashchange",()=>{scrollTo(0,0);render()});
render();
</script>
</body>
</html>
